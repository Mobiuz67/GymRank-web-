<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymRank</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c1b;--card:#1f1d33;--tx:#f2f2fa;--mu:#9a98b5;--bl:#5bb8fa;--gr:#2bb55f;--or:#f59a2b;--bd:#2c2a47;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0e0c1b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0e0c1b;color:var(--tx);font-family:Nunito,system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.lv{flex:1}.lv b{font-size:14px}.bar{height:10px;border:2px solid var(--bl);border-radius:8px;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--bl)}
.chip{font-weight:800}
main{flex:1;overflow-y:auto;padding:16px}
nav{display:flex;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);background:#0e0c1b}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0;font:700 12px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}nav button.on{color:var(--bl);background:#171529}
h2{font-size:24px;margin:6px 0 12px}h3{margin:20px 0 8px;font-size:18px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid .card{margin:0}.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:800}
.btn{display:block;width:100%;background:var(--bl);color:#0e0c1b;border:0;border-radius:14px;padding:13px;font:800 16px Nunito,sans-serif;box-shadow:0 4px 0 #3b8cc4}
.btn.g{background:var(--gr);color:#fff;box-shadow:0 4px 0 #1d7f43}
.btn.s{background:#35335a;color:var(--tx);box-shadow:none;width:auto;padding:8px 12px;font-size:14px;display:inline-block}
input,select{width:100%;background:#13112a;color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:11px;font:700 16px Nunito,sans-serif;margin-bottom:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.hex{width:54px;height:60px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-size:24px;flex:none}
.mr{display:flex;align-items:center;gap:12px}.mr div:nth-child(2){flex:1}.mr b{font-size:17px}
.pg{height:8px;background:#13112a;border-radius:6px;margin-top:6px;overflow:hidden}.pg i{display:block;height:100%}
.set{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.set:last-child{border:0}
.wk{background:#1d6b2f;border-radius:16px;padding:16px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal div{background:var(--card);border-radius:10px;padding:10px 0;font-weight:700}.cal .d{background:var(--gr)}.cal .t{outline:2px solid var(--bl)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs .btn{width:auto;flex:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av{overflow:hidden;font-size:40px;width:68px;height:68px;border-radius:50%;background:#13112a;display:grid;place-items:center;border:3px solid var(--bl);flex:none}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pick button{font-size:22px;background:#13112a;border:2px solid var(--bd);border-radius:12px;padding:6px 8px;color:var(--tx)}.pick button.on{border-color:var(--bl);background:#25234a}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}.sw.on{border-color:#fff}
.bdg{text-align:center;font-size:11px;padding:10px 4px}.bdg span{font-size:28px;display:block}.bdg.off{opacity:.3;filter:grayscale(1)}
.gl{display:flex;gap:6px}.gl button{flex:1;background:#13112a;border:2px solid var(--bd);border-radius:10px;padding:8px 0;color:var(--tx);font:800 14px Nunito,sans-serif}.gl button.on{background:var(--bl);border-color:var(--bl);color:#0e0c1b}
.gl .w{font-size:22px}
#bp{position:fixed;z-index:10;background:var(--card);border:2px solid var(--bl);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.5)}#bp span{color:var(--mu)}#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px);background:var(--card);border:2px solid var(--bl);padding:10px 16px;border-radius:14px;font-weight:800;opacity:0;transition:.3s;z-index:9;pointer-events:none;text-align:center;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-30px;font-size:22px;z-index:8;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
#rt{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--bl);color:#0e0c1b;font-weight:800;border-radius:24px;padding:10px 16px;display:none;z-index:7}
.bmi{height:10px;border-radius:6px;background:linear-gradient(90deg,#5bb8fa 0 18%,#2bb55f 18% 50%,#f59a2b 50% 70%,#e5484d 70%);position:relative;margin:12px 0 6px}.bmi i{position:absolute;top:-5px;width:6px;height:20px;border-radius:3px;background:#fff}
.grp{background:var(--card);border-radius:14px;margin-bottom:18px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.grp .it:last-child{border-bottom:0}.it:active{background:#25234a}
.ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:17px;flex:none}
.it .tt{flex:1;font-weight:700;font-size:16px}.it .vl{font-size:14px}.it .ch{color:var(--mu);font-size:22px;line-height:1}
.it.pf{padding:14px}.dot{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle}
.bk{color:var(--bl);font-weight:800;font-size:16px;padding:4px 0;cursor:pointer}
</style></head><body>
<div id="app">
<header><div class="lv" id="lv"></div><div class="chip" id="st"></div></header>
<main id="m"></main>
<nav id="nv"></nav><div id="toast"></div><div id="rt" onclick="clearInterval(rest.h);this.style.display='none'"></div>
</div>
<script>

var _sid=0;
function mi(g,c,z){return'<svg viewBox="0 0 24 24" width="'+z+'" height="'+z+'" fill="'+c+'" style="color:'+c+'">'+MI[g]+'</svg>'}
function shield(c,i,g,w){var id="sg"+(++_sid),h=Math.round(w*1.15),pips="";

 return'<svg viewBox="0 0 60 70" width="'+w+'" height="'+h+'" style="flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".35" stop-color="'+c+'"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient></defs><path d="M30 2L56 12v24c0 16-12 27-26 32C16 63 4 52 4 36V12z" fill="url(#'+id+')"/><path d="M30 7.500L51 15.500v20.500c0 13-9.500 22-21 26.500C18.500 58 9 49 9 36V15.500z" fill="#171529"/>'+inner+(g?pips:'')+'</svg>'}
var TIERS=[["WOOD",0,"#b8742a"],["BRONZE",200,"#cd7f32"],["SILVER",800,"#c0c8d4"],["GOLD",2600,"#f5c542"],["PLATINUM",8000,"#7fe3d6"],["DIAMOND",24200,"#6fd2ff"]];
function DEF(){return{name:"Atlet",av:"f1",age:25,ht:170,sex:"Pria",wkt:4,acc:"#5bb8fa",water:{},logs:[],bw:[],goal:60,meals:[],cal:2100,tab:"home",sub:"ranks"}}
var S=DEF();
try{var r=localStorage.getItem("gymrank");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("gymrank",JSON.stringify(S))}catch(e){}}
function day(t){var d=new Date(t||Date.now());return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function mgOf(n){for(var i=0;i<EX.length;i++)if(EX[i][0]==n)return EX[i][1]}
function vol(l){return l.w*l.r}
function pts(g){return S.logs.filter(function(l){return mgOf(l.ex)==g}).reduce(function(a,l){return a+vol(l)},0)}
function tier(p){var t=0;for(var i=0;i<TIERS.length;i++)if(p>=TIERS[i][1])t=i;return t}
function xp(){return S.logs.length*10}
function lvOf(x){return Math.floor(Math.sqrt(x/10))+1}
function lvBase(L){return 10*(L-1)*(L-1)}
function lvPct(x){var L=lvOf(x),a=lvBase(L),b=lvBase(L+1);return Math.round((x-a)/(b-a)*100)}
function streak(){var ds={};S.logs.forEach(function(l){ds[day(l.t)]=1});var n=0,d=new Date();if(!ds[day(d)])d.setDate(d.getDate()-1);while(ds[day(d)]){n++;d.setDate(d.getDate()-1)}return n}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}
function num(i){return parseFloat($(i).value)||0}
function go(t){S.tab=t;S.ss="";draw()}
function sub(s){S.sub=s;draw()}

function prev(){var el=$("pv");if(!el)return;var ex=$("ex").value,g=mgOf(ex),w=num("w"),r=num("r");
 if(!r){el.innerHTML='<div class="mu">Isi beban & repetisi untuk melihat preview peringkat.</div>';return}
 var p=pts(g),n=p+w*r,i=tier(p),j=tier(n),T=TIERS[j],nx=TIERS[j+1],pc=nx?Math.round((n-T[1])/(nx[1]-T[1])*100):100;
 var up=j>i;
 el.innerHTML='<div class="mr"><div style="flex:none">'+shield(T[2],j,g,56)+'</div><div><b>'+g+'</b> <span class="mu">+'+(w*r)+' kg volume</span><div style="color:'+T[2]+';font-weight:800">'+(up?TIERS[i][0]+' → '+T[0]+' 🎉':T[0])+'</div><div class="pg"><i style="width:'+pc+'%;background:'+T[2]+'"></i></div><div class="mu">'+n+(nx?' / '+nx[1]:'')+' kg volume'+(nx?' · sisa '+(nx[1]-n)+' kg ke '+nx[0]:'')+'</div>'+(w>0?'<div class="mu">Estimasi 1RM: <b>'+Math.round(w*(1+r/30))+' kg</b></div>':'')+'</div></div>'}
function addSet(){var ex=$("ex").value,w=num("w"),r=num("r");if(!r){alert("Isi jumlah repetisi");return}
 var g=mgOf(ex),ti=tier(pts(g)),lv0=lvOf(xp()),b0=badges().filter(function(b){return b[2]}).length;
 S.logs.push({ex:ex,w:w,r:r,t:Date.now()});save();draw();
 var tj=tier(pts(g)),b1=badges().filter(function(b){return b[2]}).length;
 if(tj>ti){boom();toast("🎉 "+g+" naik ke "+TIERS[tj][0]+"!")}else if(lvOf(xp())>lv0){boom();toast("⬆️ Level naik!")}else if(b1>b0){boom();toast("🏅 Lencana baru terbuka!")}else toast("+10 XP · +"+(w*r)+" kg volume")}
function delSet(i){S.logs.splice(i,1);save();draw()}
function addBW(){var v=num("bwv");if(!v)return;S.bw.push({v:v,t:Date.now()});save();draw()}
function setGoal(){var v=num("gv");if(v){S.goal=v;save();draw()}}
function addMeal(){var n=$("mn").value.trim(),c=num("mc");if(!n||!c)return;S.meals.push({n:n,c:c,p:num("mp"),t:Date.now()});save();draw()}
function delMeal(i){S.meals.splice(i,1);save();draw()}
function setCal(){var v=num("cv");if(v){S.cal=v;save();draw()}}
function setName(){var v=$("nm").value.trim();if(v){S.name=v;save();draw()}}
function reset(){if(confirm("Hapus semua data?")){S=DEF();save();draw()}}

if(d.st=="long"||d.st=="bob")b+='<path d="M26 46Q28 17 50 17Q72 17 74 46Q64 28 50 30Q36 28 26 46Z" fill="'+h+'"/>';
if(d.st=="bun")b+='<path d="M26 46Q26 17 50 17Q74 17 74 46Q62 30 50 31Q38 30 26 46Z" fill="'+h+'"/>';

b+='<path d="M36 40Q41 37 46 40M54 40Q59 37 64 40" stroke="'+h+'" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
b+='<ellipse cx="41" cy="47" rx="3" ry="3.4" fill="#fff"/><ellipse cx="59" cy="47" rx="3" ry="3.4" fill="#fff"/><circle cx="41.4" cy="47.3" r="1.9" fill="#1b1310"/><circle cx="59.4" cy="47.3" r="1.9" fill="#1b1310"/>';
b+='<path d="M50 49Q47 57 50 59Q52 59 53 58" stroke="rgba(0,0,0,.25)" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
if(d.bd)b+='<path d="M29 54Q30 76 50 77Q70 76 71 54Q66 66 50 66Q34 66 29 54Z" fill="'+h+'"/><path d="M42 67Q50 71 58 67" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
else b+='<path d="M41 66Q50 73 59 66" stroke="#8a3a3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
if(d.gl)b+='<g fill="none" stroke="#222" stroke-width="1.8"><circle cx="41" cy="47" r="7"/><circle cx="59" cy="47" r="7"/><path d="M48 47H52"/></g>';
return b+'</svg>'}
var FACE={};FD.forEach(function(d){FACE[d.k]='data:image/svg+xml;utf8,'+encodeURIComponent(faceSvg(d))});
